language: 'ko-KR'
early_access: false
reviews:
  profile: 'chill'
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  path_instructions:
    - path: "backend/src/main/java/**/controller/**"
      instructions: |
        - 인증이 필요한 엔드포인트가 공개되지 않았는지, 학생/관리자 권한 경계가 SecurityConfig 및 @AuthenticationPrincipal 사용과 일치하는지 검토한다.
        - 외부 입력은 @Valid와 적절한 Bean Validation으로 검증하고, 요청 DTO가 없거나 검증을 우회하는 변경은 실제 잘못된 요청을 허용할 때만 지적한다.
        - 컨트롤러는 HTTP 요청/응답 조립만 담당해야 한다. Repository 또는 외부 시스템을 직접 호출하거나 도메인 규칙을 구현하는 변경은 지적한다.
        - 기존 Response 응답 형식과 RestApiException/ErrorCode 예외 처리 규약을 깨는 API 계약 변경을 지적한다.
    - path: "backend/src/main/java/**/service/**"
      instructions: |
        - 엔티티 변경과 저장이 필요한 쓰기 유스케이스의 트랜잭션 경계, 실패 시 데이터 일관성, 중복 요청의 안전성을 검토한다.
        - Optional.get(), nullable 외부 응답, 빈 인증 주체처럼 확인되지 않은 값으로 인한 500 오류나 데이터 손실 가능성을 지적한다.
        - 목록/검색 API의 무제한 조회, N+1 조회, 요청마다 반복되는 원격 호출처럼 운영에서 확장성 문제를 만드는 변경을 지적한다.
        - 단순한 네이밍 선호나 기존 코드에 이미 있는 패턴만으로는 코멘트하지 않는다.
    - path: "backend/src/main/java/**/{adapter,notion,google,analytics,media,fcm}/**"
      instructions: |
        - HTTP, S3/R2, Firebase, RabbitMQ 등 외부 연동은 timeout/실패 처리, 상태 코드 검증, 재시도 시 중복 부작용, 민감 정보 노출 여부를 검토한다.
        - DB 트랜잭션 안에서 되돌릴 수 없는 외부 부작용을 수행하는 변경은 보상 또는 실패 처리 전략이 없을 때 지적한다.
        - 액세스 토큰, refresh token, API 키, 사용자 식별자 및 원본 파일 URL을 로그/응답에 불필요하게 노출하는 변경을 지적한다.
    - path: "backend/src/main/java/moadong/global/{config,util}/**"
      instructions: |
        - Spring Security matcher, JWT 필터 순서, CORS/CSRF, 비밀번호 인코더 변경이 관리자와 학생 인증 흐름을 우회하거나 약화하지 않는지 검토한다.
        - 설정값은 코드에 비밀값을 하드코딩하지 않고 환경별 주입 방식을 유지해야 한다. 운영 환경에서 불안정한 기본값 또는 fail-open 동작만 지적한다.
    - path: "backend/build.gradle"
      instructions: |
        - 의존성 추가/업데이트가 Spring Boot 3.3, Java 17과 호환되는지, 불필요한 snapshot/milestone 저장소 또는 취약한 의존성 범위를 도입하지 않는지 검토한다.
        - 테스트 태스크(unitTest, integrationTest, test)의 태그 구분과 RabbitMQ 리스너 비활성화 설정을 깨는 변경을 지적한다.
    - path: "backend/src/test/**"
      instructions: |
        - 변경된 동작의 성공·실패·권한 경계가 검증되는지 살핀다. 실제 프로덕션 버그를 놓칠 수 있는 누락만 지적한다.
        - 테스트가 외부 네트워크, 현재 시간, 실행 순서, 공유 상태에 의존해 비결정적이 되는 변경을 지적한다.
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "**"
chat:
  auto_reply: true
