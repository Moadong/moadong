name: Close Jira Issue
on:
  issues:
    types:
      - closed

jobs:
    close-issue:
      name: Close Jira Issue
      runs-on: ubuntu-latest
      permissions:
        issues: write
      steps:
        - name: Extract Jira Issue Key from Title
          id: extract-key
          # 제목은 누구나 쓸 수 있는 값이라 ${{ }}로 run에 바로 넣으면 셸 명령이 주입된다. env로 넘긴다.
          env:
            TITLE: ${{ github.event.issue.title }}
          run: |
            # Sentry 봇 이슈 제목의 `[Sentry MOADONG-4R]`을 Jira 키로 잘못 잡지 않게 Jira 프로젝트 키(MOA)만 본다.
            ISSUE_KEY=$(echo "$TITLE" | grep -oE 'MOA-[0-9]+' | head -1)
            echo "JIRA_ISSUE_KEY=$ISSUE_KEY" >> $GITHUB_ENV
            echo "Extracted Jira Issue Key: $ISSUE_KEY"

        - name: Transition Jira Issue to Done
          if: env.JIRA_ISSUE_KEY != ''
          env:
            JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
            JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
            JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          run: |
            TRANSITIONS=$(curl -s \
              -u "${JIRA_USER_EMAIL}:${JIRA_API_TOKEN}" \
              -H "Content-Type: application/json" \
              "${JIRA_BASE_URL}/rest/api/3/issue/${JIRA_ISSUE_KEY}/transitions")

            DONE_NAME="완료"
            TRANSITION_ID=$(echo "$TRANSITIONS" | jq -r --arg name "$DONE_NAME" '.transitions[] | select(.name == $name) | .id')

            if [ -z "$TRANSITION_ID" ]; then
              echo "Transition not found. Available transitions:" >&2
              echo "$TRANSITIONS" | jq -r '.transitions[].name' >&2
              exit 1
            fi

            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST \
              -u "${JIRA_USER_EMAIL}:${JIRA_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"transition\":{\"id\":\"${TRANSITION_ID}\"}}" \
              "${JIRA_BASE_URL}/rest/api/3/issue/${JIRA_ISSUE_KEY}/transitions")

            if [ "$HTTP_CODE" = "204" ]; then
              echo "Successfully transitioned ${JIRA_ISSUE_KEY} to ${DONE_NAME}"
            else
              echo "Jira API error (HTTP $HTTP_CODE)" >&2
              exit 1
            fi

        - name: Add comment on GitHub issue
          if: env.JIRA_ISSUE_KEY != ''
          env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
            ISSUE_NUMBER: ${{ github.event.issue.number }}
          run: |
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Jira Issue Closed: [${JIRA_ISSUE_KEY}](${JIRA_BASE_URL}/browse/${JIRA_ISSUE_KEY}) ✅"
