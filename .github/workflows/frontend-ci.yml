name: Frontend CI

on:
  pull_request:
    branches: [main, develop-fe]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Restore TypeScript incremental cache
        uses: actions/cache@v4
        with:
          path: frontend/node_modules/.cache/tsconfig.tsbuildinfo
          key: tsbuildinfo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            tsbuildinfo-${{ runner.os }}-

      - name: Prettier check
        run: npx prettier --check "**/*.{ts,tsx,js,jsx,css,scss}"

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Tracking audit (미사용 USER_EVENT 검사)
        run: npm run audit:tracking

      - name: Build
        env:
          SKIP_DYNAMIC_SITEMAP: 'true'
        run: npm run build
