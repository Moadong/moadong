name: Frontend CI

on:
  pull_request:
    branches: [main, develop-fe]
    # GITHUB_TOKEN으로 연 PR(디자인 피드백 draft)은 opened로 돌지 않는다. 사람이 Ready를 누를 때 돈다(위키 ADR-015).
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches: [develop-fe]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

# PR의 테스트·린트 설정 코드를 실행하므로 읽기 권한만 주고, 토큰을 .git/config에 남기지 않는다.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Restore TypeScript incremental cache
        uses: actions/cache@v4
        with:
          path: frontend/node_modules/.cache/tsconfig.tsbuildinfo
          key: tsbuildinfo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            tsbuildinfo-${{ runner.os }}-

      - name: Prettier check
        run: npx prettier --check "**/*.{ts,tsx,js,jsx,css,scss}"

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Tracking audit (미사용 USER_EVENT 검사)
        run: npm run audit:tracking

      - name: Codex skill sync check (.codex/skills가 .claude 원본과 같은지)
        run: |
          node --test scripts/sync-codex-skills.test.mjs
          npm run codex:check

      - name: Build
        env:
          SKIP_DYNAMIC_SITEMAP: 'true'
        run: npm run build
