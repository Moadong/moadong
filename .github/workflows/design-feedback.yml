name: Design feedback → draft PR

on:
  issues:
    types: [labeled]

permissions: {}

# 라벨 이름까지 넣어야 같은 이슈에 다른 라벨이 붙을 때 대기 중인 실행이 밀려 취소되지 않는다.
# 같은 이슈를 다시 라벨링해 재실행할 때 브랜치 push가 겹치지 않게 직렬화한다.
concurrency: design-feedback-${{ github.event.issue.number }}-${{ github.event.label.name }}

# 이슈 본문에는 실서비스 화면 텍스트(동아리 소개 등 누구나 쓸 수 있는 내용)가 섞여 들어온다.
# 그래서 에이전트를 돌리는 job에는 쓰기 권한을 주지 않고, 사람이 diff를 보기 전에는 시크릿을 쓰는 CI가 돌지 않게 한다.
#   analyze: 에이전트가 frontend/src를 고치고 패치·PR 문구·되묻기 댓글을 파일로 남긴다. 읽기 토큰만 있다.
#   verify:  시크릿·sudo 없이 패치를 적용해 타입체크·린트·테스트를 돌린다.
#   publish: 에이전트 없이 고정 브랜치 design/<이슈번호>로 push하고 draft PR을 연다.
#            GITHUB_TOKEN으로 만든·갱신한 PR의 opened·synchronize·reopened는 실행을 승인 대기 상태로만 만든다.
#            누가 승인하거나 draft에서 Update branch·reopen을 눌러도, 시크릿을 쓰는 chromatic·harry는 draft 조건에
#            걸려 돌지 않는다. 그 job들은 사람이 Ready for review를 누를 때(ready_for_review) 처음 이 코드를 실행한다.
#            시크릿 없는 frontend-ci는 draft에서도 돌 수 있다. 결정 기록은 위키 ADR-015.
#            레포 설정 "Allow GitHub Actions to create and approve pull requests"가 켜져 있어야 PR을 만들 수 있다.
# harry App 토큰은 쓰지 않는다. 설치된 App에는 contents 쓰기 권한이 없고, 있더라도 에이전트 손에 쓰기 토큰이 간다.

jobs:
  analyze:
    # 디자이너 툴바 피드백 이슈만 처리한다.
    # - 이슈 폼이 design-feedback 라벨을 자동으로 붙이므로 labeled 한 번만 트리거로 쓴다.
    #   (opened까지 걸면 생성 시 붙는 라벨 때문에 같은 이슈가 두 번 돈다.)
    #   재실행은 라벨을 뗐다 다시 붙이면 된다.
    # - 조직 멤버가 연 이슈만: 외부인이 이슈로 에이전트를 돌리지 못하게 한다.
    if: >-
      ${{ github.event.label.name == 'design-feedback'
      && contains(fromJson('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
    outputs:
      has_patch: ${{ steps.collect.outputs.has_patch }}
      has_comment: ${{ steps.collect.outputs.has_comment }}
      base_sha: ${{ steps.collect.outputs.base_sha }}
    steps:
      - name: Checkout develop-fe
        uses: actions/checkout@v4
        with:
          ref: develop-fe
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Prepare output directory
        run: mkdir -p design-feedback-out

      # 에이전트는 frontend/src(새 파일 생성 포함)와 결과 폴더만 고칠 수 있고, 실행할 수 있는 건 인자가 고정된 명령 넷(이 이슈 보기, git status, git diff, typecheck)뿐이다.
      # git log·git diff에 인자를 허용하면 --output=으로 node_modules를 덮어 typecheck 때 코드를 실행할 수 있다.
      # 린트는 설정 파일을 실행하므로 시크릿 없는 verify job에서 돌린다.
      # 테스트는 에이전트가 쓴 코드를 실행하는데 이 job의 환경변수에 OAuth 토큰이 있으니 여기서 돌리지 않고 verify job에서 돌린다.
      # 프로세스 환경변수(OAuth 토큰)를 읽어 결과 파일에 옮기지 못하게 /proc 등은 Read·Grep·Glob 모두 막는다.
      - name: Apply design feedback
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ github.token }}
          prompt: |
            저장소 루트의 `.github/design-feedback-rules.md`를 읽고, 그 절차를 처음부터 끝까지 그대로 따라라.
            대상 이슈 번호는 ${{ github.event.issue.number }}, 레포는 ${{ github.repository }}다.
            셸 명령에는 이 값을 그대로 적어라(셸 변수를 쓰면 권한 검사에서 거부된다).
          claude_args: |
            --model claude-opus-5
            --allowedTools "Read,Glob,Grep,Edit(frontend/src/**),Write(frontend/src/**),Edit(design-feedback-out/**),Write(design-feedback-out/**),Bash(gh issue view ${{ github.event.issue.number }} --repo ${{ github.repository }}),Bash(git status),Bash(git diff),Bash(npm --prefix frontend run typecheck)"
            --disallowedTools "Read(//proc/**),Read(//sys/**),Read(//run/**),Read(//home/runner/work/_temp/**),Grep(//proc/**),Grep(//sys/**),Grep(//run/**),Grep(//home/runner/work/_temp/**),Glob(//proc/**),Glob(//sys/**),Glob(//run/**),Glob(//home/runner/work/_temp/**)"
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}

      # 고칠 수 있는 메모만 고치고 나머지는 되묻는 부분 처리를 허용하므로, 패치와 댓글이 함께 나올 수 있다.
      - name: Collect result
        id: collect
        run: |
          out=design-feedback-out
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git add -A frontend/src
          git diff --cached --binary -- frontend/src > "$out/fix.patch"
          has_patch=false
          has_comment=false
          if [[ -s $out/fix.patch && -s $out/pr-title.txt && -s $out/pr-body.md && -s $out/commit-message.txt ]]; then
            has_patch=true
          elif [[ -s $out/fix.patch ]]; then
            echo "::warning::frontend/src 변경은 있지만 PR 결과 파일이 비어 있어 패치를 버린다."
          fi
          if [[ -s $out/comment.md ]]; then
            has_comment=true
          fi
          if [[ $has_patch == false && $has_comment == false ]]; then
            echo "::error::에이전트가 PR 결과 파일도 되묻기 댓글도 남기지 않았다."
            exit 1
          fi
          echo "has_patch=$has_patch" >> "$GITHUB_OUTPUT"
          echo "has_comment=$has_comment" >> "$GITHUB_OUTPUT"

      # 공개 레포 아티팩트는 누구나 받을 수 있다. 정해진 파일만 올리고, 토큰 모양 문자열이 있으면 멈춘다.
      - name: Scan result for secrets
        run: |
          if grep -rEl 'sk-ant-|ghs_|ghp_|gho_|github_pat_|sntry[su]_' design-feedback-out; then
            echo "::error::결과 파일에 토큰 모양 문자열이 있다."
            exit 1
          fi

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: design-feedback-out
          path: |
            design-feedback-out/fix.patch
            design-feedback-out/commit-message.txt
            design-feedback-out/pr-title.txt
            design-feedback-out/pr-body.md
            design-feedback-out/comment.md
          if-no-files-found: ignore
          retention-days: 7

  verify:
    needs: analyze
    if: ${{ needs.analyze.outputs.has_patch == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # 패치·설정 코드가 sudo로 러너 메모리에서 런타임 토큰을 꺼내 기본 브랜치 캐시를 오염시키지 못하게 한다.
      - name: Disable sudo
        run: |
          sudo rm -f /etc/sudoers.d/runner
          if sudo -n true 2>/dev/null; then
            echo "::error::sudo가 아직 살아 있다."
            exit 1
          fi

      - name: Checkout analyzed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.analyze.outputs.base_sha }}
          persist-credentials: false

      - name: Download result
        uses: actions/download-artifact@v4
        with:
          name: design-feedback-out
          path: design-feedback-out

      # PR 제목·본문·커밋 메시지는 에이전트가 쓴 글이 그대로 PR에 올라가고, Ready 뒤 harry가 읽는다(커밋은 git log로).
      # comment.md는 이슈 댓글로만 달리고 이를 읽는 에이전트가 없어 검사하지 않는다(되묻기만 있으면 이 job은 돌지도 않는다).
      # 렌더링하면 안 보이는 곳(HTML 주석·태그, 링크 참조 정의, 링크 제목, 서식 문자)에 지시를 숨기면
      # 사람이 PR 화면에서 못 본다. 숨길 자리를 하나씩 막는 대신, 규칙 파일의 본문 형식(표·제목·Close 줄)에
      # 필요 없는 구문을 통째로 받지 않는다: `<`(HTML), `]:`(참조 정의·각주), `](`(링크·이미지),
      # 유니코드 Cf 범주(태그 문자·제로폭·양방향 제어처럼 화면에 안 그려지는 문자).
      - name: Check PR text
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python3 - design-feedback-out/pr-title.txt design-feedback-out/pr-body.md design-feedback-out/commit-message.txt <<'PY'
          import os, re, sys, unicodedata
          # 머지 때 close-issue 워크플로가 본문의 "Close #N"을 모두 닫는다. 이 이슈 말고 다른 번호는 받지 않는다.
          # 그 워크플로의 정규식에 GitHub 기본 키워드(closed·fixed·resolved, owner/repo#N)까지 더해 넓게 잡는다.
          # 그 워크플로처럼 단어 경계를 보지 않는다(prefixes #5, 한글에 붙은 close #5도 그쪽은 닫는다).
          CLOSING = re.compile(r'(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s+(?:[\w.-]+/[\w.-]+)?#(\d+)', re.I)
          issue = os.environ['ISSUE_NUMBER']
          # Cf(태그 문자·제로폭·양방향 제어)에 더해, 범주는 달라도 화면에 안 보이는 문자를 막는다.
          # 변형 선택자(Mn)는 글자 뒤에 이어 붙여 바이트를 숨기는 데 쓰이고, 한글 채움·점자 공백은 빈칸으로 보인다.
          def is_blank_glyph(c):
              o = ord(c)
              return 0xFE00 <= o <= 0xFE0F or 0xE0100 <= o <= 0xE01EF or c in '\u115f\u1160\u3164\uffa0\u2800'
          bad = False
          for path in sys.argv[1:]:
              for n, line in enumerate(open(path, encoding='utf-8'), 1):
                  hits = [s for s in ('<', ']:', '](') if s in line]
                  if any(unicodedata.category(c) == 'Cf' or is_blank_glyph(c) for c in line):
                      hits.append('보이지 않는 서식 문자')
                  hits += [f'다른 이슈 닫기 #{m}' for m in CLOSING.findall(line) if m != issue]
                  if hits:
                      print(f"::error::{path}:{n}: 허용하지 않는 구문 {hits}")
                      bad = True
          sys.exit(1 if bad else 0)
          PY

      - name: Apply patch
        id: apply
        run: |
          # frontend/src 밖을 건드리는 패치는 받지 않는다.
          outside=$(git apply --numstat design-feedback-out/fix.patch | cut -f3 | grep -v '^frontend/src/' || true)
          if [[ -n "$outside" ]]; then
            echo "::error::frontend/src 밖의 변경: $outside"
            exit 1
          fi
          # frontend/src 안에도 CLAUDE.md가 있다. Ready 뒤 harry 같은 에이전트가 이 파일을 지시로 읽으므로
          # 수정에 필요 없는 마크다운 변경은 받지 않는다.
          docs=$(git apply --numstat design-feedback-out/fix.patch | cut -f3 | grep -iE '\.md$' || true)
          if [[ -n "$docs" ]]; then
            echo "::error::마크다운 변경은 받지 않는다: $docs"
            exit 1
          fi
          # --index로 적용해야 새 파일도 아래 목록에 잡힌다.
          git apply --index design-feedback-out/fix.patch
          # 새 파일은 TS·TSX만 받는다. analyze에 Write(frontend/src/**)를 열었으니 확장자는 권한 문자열이 아니라 여기서 강제한다.
          # --no-renames: 기존 파일을 새 경로로 옮기는 패치는 rename(R)으로 잡혀 A 필터를 비켜 가므로 삭제+추가로 본다.
          added=$(git diff --cached --name-only --no-renames --diff-filter=A -- frontend/src | grep -vE '\.tsx?$' || true)
          if [[ -n "$added" ]]; then
            echo "::error::TS·TSX가 아닌 새 파일: $added"
            exit 1
          fi
          # 점으로 시작하는 경로(.gitattributes로 PR diff를 접는 등)와 __mocks__(jest가 모든 테스트에 자동으로 적용)는 받지 않는다.
          hidden=$(git diff --cached --name-only --no-renames -- frontend/src | grep -E '(^|/)(\.|__mocks__/)' || true)
          if [[ -n "$hidden" ]]; then
            echo "::error::점으로 시작하는 경로나 __mocks__: $hidden"
            exit 1
          fi
          # 일반 파일(100644)과 삭제(000000)만 받는다. 심링크·실행 비트·서브모듈을 하나씩 막지 않고 나머지를 모두 거부한다.
          modes=$(git diff --cached --raw --no-renames -- frontend/src | awk '$2 != "000000" && $2 != "100644" { print $NF }')
          if [[ -n "$modes" ]]; then
            echo "::error::일반 파일이 아닌 변경: $modes"
            exit 1
          fi
          # NUL 바이트 하나로 파일이 binary가 되면 PR 화면과 git diff에 내용이 안 보이고 아래 검사도 비켜 간다.
          bin=$(git diff --cached --numstat --no-renames -- frontend/src | awk -F'\t' '$1 == "-" { print $3 }')
          if [[ -n "$bin" ]]; then
            echo "::error::binary 변경: $bin"
            exit 1
          fi
          # 테스트를 건너뛰거나 일부만 돌게 하는 구문을 더하면 테스트 통과가 아무것도 보장하지 않는다.
          # 철자를 바꾸면(변수에 담기 등) 비켜 갈 수 있는 best-effort 검사다. 최종 관문은 사람이 diff를 보는 것이다.
          skips=$(git diff --cached -U0 -- 'frontend/src/*.test.*' 'frontend/src/*.spec.*' 'frontend/src/*__tests__/*' \
            | grep -E '^\+' \
            | grep -E '\.(skip|only|todo|failing)\b|\b[fx](it|describe|test)\s*\(|\b(it|test|describe)\s*\[' || true)
          # 테스트가 아닌 파일에서 jest 전역을 건드리면(jest.mock, globalThis.it 바꾸기) 모든 테스트에 영향을 준다.
          globals=$(git diff --cached -U0 -- frontend/src \
            ':(exclude)frontend/src/*.test.*' ':(exclude)frontend/src/*.spec.*' ':(exclude)frontend/src/*__tests__/*' \
            | grep -E '^\+' | grep -E '\bjest\.|globalThis\.(it|test|describe)\b' || true)
          if [[ -n "$skips$globals" ]]; then
            echo "::error::테스트를 건너뛰거나 jest 전역을 건드리는 구문: $skips $globals"
            exit 1
          fi
          # 실패하는 테스트 파일을 지우면 skip보다 쉽게 테스트를 통과한다. 테스트 파일을 일반 이름으로 옮겨도
          # --no-renames로 삭제로 잡힌다. 테스트 케이스 블록만 지우는 경우는 사람이 diff로 본다.
          deleted_tests=$(git diff --cached --name-only --no-renames --diff-filter=D -- \
            'frontend/src/*.test.*' 'frontend/src/*.spec.*' 'frontend/src/*__tests__/*' || true)
          if [[ -n "$deleted_tests" ]]; then
            echo "::error::테스트 파일 삭제: $deleted_tests"
            exit 1
          fi
          names=$(git diff --cached --name-only --diff-filter=d -- frontend/src | sed 's#^frontend/##')
          # 파일 이름은 에이전트가 정한 값이라 뒤 단계에서 따옴표 없이 인자로 펼쳐진다.
          # 공백을 허용하면 `a -c src/x.mjs` 같은 디렉터리 이름으로 eslint에 옵션을 주입할 수 있어 줄 단위로 막는다.
          if [[ -n "$names" ]] && grep -qvE '^src/[A-Za-z0-9._/@-]+$' <<<"$names"; then
            echo "::error::허용하지 않는 파일 이름: $names"
            exit 1
          fi
          files=$(tr '\n' ' ' <<<"$names")
          echo "files=$files" >> "$GITHUB_OUTPUT"

      # 캐시를 쓰지 않는다. 이 job이 저장한 캐시는 다른 브랜치가 복원한다.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      # 기준은 종료 코드다(경고는 통과). lint:fix는 무관한 파일을 고치니 쓰지 않는다.
      - name: Lint changed files
        if: ${{ steps.apply.outputs.files != '' }}
        working-directory: frontend
        run: npx eslint $FILES
        env:
          FILES: ${{ steps.apply.outputs.files }}

      # 테스트는 에이전트가 쓴 코드를 실행한다. 러너 위에서 바로 돌리면 sudo가 없어도 runner 사용자로
      # 뒤에 도는 액션 post 스텝(런타임 토큰을 받는다)의 파일을 덮어쓰거나 그 환경변수를 읽을 수 있고,
      # docker 그룹이라 호스트 root도 얻는다. 그래서 frontend만 마운트한 컨테이너에서 네트워크 없이 돌린다.
      # 의존성은 위에서 base의 lockfile로 설치한 node_modules를 그대로 쓴다.
      - name: Test
        working-directory: frontend
        run: >-
          docker run --rm --network none
          --user "$(id -u):$(id -g)" -e HOME=/tmp -e CI=true
          -v "$PWD":/app -w /app
          node:20 npm test

  publish:
    needs: [analyze, verify]
    if: ${{ !cancelled() && needs.analyze.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Download result
        uses: actions/download-artifact@v4
        with:
          name: design-feedback-out
          path: design-feedback-out

      # 처리하지 못한 메모의 되묻기·거부 댓글. 브랜치 push가 실패해도 남도록 먼저 단다.
      - name: Comment questions
        if: ${{ needs.analyze.outputs.has_comment == 'true' }}
        run: gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body-file design-feedback-out/comment.md

      - name: Comment verify failure
        if: ${{ needs.analyze.outputs.has_patch == 'true' && needs.verify.result == 'failure' }}
        run: |
          printf '수정안을 만들었지만 검증(타입체크·린트·테스트)을 통과하지 못해 브랜치를 올리지 않았어요.\n로그: %s\n' "$RUN_URL" > /tmp/comment.md
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body-file /tmp/comment.md

      - name: Checkout analyzed commit
        if: ${{ needs.analyze.outputs.has_patch == 'true' && needs.verify.result == 'success' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.analyze.outputs.base_sha }}
          path: repo

      - name: Push branch and open draft PR
        if: ${{ needs.analyze.outputs.has_patch == 'true' && needs.verify.result == 'success' }}
        working-directory: repo
        run: |
          out=../design-feedback-out
          branch="design/$ISSUE_NUMBER"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git apply "$out/fix.patch"
          git add -A frontend/src
          git commit -F "$out/commit-message.txt"

          # 이 브랜치를 head로 쓰는 Ready PR을 대상 브랜치와 상관없이 모두 draft로 돌린다.
          # 사람이 Ready를 눌렀더라도 코드가 바뀌니 다시 승인을 받는다. 누가 대상을 main으로 바꾼 PR도
          # 같은 브랜치라 force-push가 그대로 올라가므로 빼면 안 된다.
          # --head는 브랜치 이름만 보고 포크 PR까지 잡으니 이 레포 브랜치 PR만 고른다.
          undo_ready() {
            local urls u
            urls=$(gh pr list --repo "$REPO" --head "$branch" --state open \
              --json url,isDraft,isCrossRepository \
              --jq '.[] | select((.isCrossRepository | not) and (.isDraft | not)) | .url')
            for u in $urls; do
              gh pr ready "$u" --repo "$REPO" --undo
            done
          }

          # push 전에 돌려야 검토 안 된 코드가 Ready 상태로 올라가는 틈이 없고,
          # 조회와 push 사이에 Ready가 눌렸을 수 있어 push 뒤에 한 번 더 돌린다.
          undo_ready
          # 라벨을 다시 붙여 재실행하면 같은 브랜치를 새 결과로 덮는다.
          git push --force origin "HEAD:refs/heads/$branch"
          undo_ready

          # 제목·본문을 고치거나 새로 여는 건 develop-fe 대상 PR만이다.
          pr=$(gh pr list --repo "$REPO" --head "$branch" --base develop-fe --state open \
            --json url,isCrossRepository \
            --jq 'map(select(.isCrossRepository | not)) | .[0].url // empty')

          # 제목은 에이전트가 정한 값이라 --title=로 붙여 넘긴다. -로 시작해도 옵션으로 읽히지 않는다.
          title=$(head -n1 "$out/pr-title.txt" | tr -d '\n')
          if [[ -z $pr ]]; then
            pr=$(gh pr create --repo "$REPO" --draft --base develop-fe --head "$branch" \
              --title="$title" --body-file "$out/pr-body.md")
            done_msg="디자인 수정안으로 draft PR을 열었어요"
          else
            gh pr edit "$pr" --repo "$REPO" --title="$title" --body-file "$out/pr-body.md"
            done_msg="PR을 새 수정안으로 바꾸고 draft로 뒀어요"
          fi

          {
            echo "$done_msg: $pr"
            echo "검증(타입체크·린트·테스트)은 통과했어요."
            echo
            echo "1. PR의 Files changed와 Vercel 프리뷰로 확인해 주세요."
            echo "2. 괜찮으면 **Ready for review**를 눌러 주세요. 그때부터 Chromatic·리뷰봇까지 모든 검사가 이 코드를 실행해요."
            echo "   PR에 뜨는 **Approve workflows to run**은 누르지 마세요. Ready를 누르면 필요한 검사가 다 돌고,"
            echo "   승인 버튼은 Ready 전 상태로 만들어진 실행까지 돌릴 수 있어요."
            echo "3. 아니면 PR을 닫으면 돼요."
          } > /tmp/comment.md
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body-file /tmp/comment.md

  # analyze가 중간에 죽거나(턴 소진·API 오류·결과 없음) publish가 실패하면 라벨을 붙인 사람에게 알린다.
  # verify 실패는 publish가 따로 댓글을 단다.
  notify-failure:
    needs: [analyze, verify, publish]
    if: ${{ !cancelled() && (needs.analyze.result == 'failure' || needs.publish.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Comment failure
        run: |
          printf '디자인 피드백 자동화가 중간에 실패했어요. 로그: %s\n라벨을 뗐다 다시 붙이면 재실행돼요.\n' "$RUN_URL" > /tmp/comment.md
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body-file /tmp/comment.md
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
