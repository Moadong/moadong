name: harry PR Review

on:
  pull_request:
    types: [opened, synchronize]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  harry-review:
    # 같은 레포 브랜치 PR만 리뷰한다. 포크 PR(외부 공격자)은 프롬프트 인젝션 위험이 있어 제외.
    # main으로 올라오는 PR은 리뷰하지 않는다(develop 등 상위 브랜치에서 이미 리뷰됨).
    if: >-
      ${{ github.event_name == 'pull_request'
      && github.event.pull_request.draft == false
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.base.ref != 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Generate harry App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.HARRY_APP_ID }}
          private-key: ${{ secrets.HARRY_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: harry review
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          # PR에 추적(총평) 코멘트를 만들고 harry가 그 코멘트를 리뷰 내용으로 업데이트하게 한다.
          # 최초 리뷰(opened)에서만 총평 코멘트를 남기고, 이후 추가 푸시(synchronize) 재리뷰는
          # 인라인 코멘트만 남기도록 opened일 때만 켠다.
          track_progress: ${{ github.event.action == 'opened' }}
          prompt: |
            너는 'harry'라는 이름의 PR 리뷰봇이다.
            저장소 루트의 `.github/harry-review-rules.md` 파일을 읽고,
            그 기준에 따라 이 PR의 변경사항을 리뷰해라.

            ## 리뷰 범위
            - 이번 실행 이벤트는 '${{ github.event.action }}'다.
            - 'synchronize'(추가 푸시로 인한 재실행)면, 직전 리뷰 이후 새로 추가된
              커밋의 변경분만 리뷰한다. 다음 명령으로 변경분을 확인해라:
              `git diff ${{ github.event.before }} ${{ github.event.after }}`
              이미 리뷰·지적했던 부분(이번에 바뀌지 않은 줄)은 다시 보지도 코멘트하지도 마라.
              (해당 커밋 범위를 가져올 수 없으면 base 브랜치 대비 전체를 보되, 이미 지적한 내용은 반복하지 마라.)
            - 'opened'면 PR 전체 변경사항(diff)을 리뷰한다.

            ## 코멘트 방식
            - 구체적인 줄에 대한 지적은 반드시 `create_inline_comment` 도구를 사용해
              해당 파일·줄에 인라인 리뷰 코멘트로 남겨라. 줄 단위 지적을 요약 코멘트에 나열하지 마라.
            - 총평(요약) 코멘트는 '최초 리뷰(opened)'에서만 남긴다. 이때만 전체 총평을 한 덩어리로
              남기고, 룰 위반이 없으면 짧게 칭찬 한 줄만 남긴다.
            - '재리뷰(synchronize)'에서는 인라인 코멘트만 남긴다. 총평·요약 코멘트는 새로 만들지 마라
              (최초 리뷰에 이미 있다). 새로 지적할 인라인이 없으면 아무 코멘트도 남기지 마라.
            - 모든 코멘트는 한국어 '해요체'로 작성해라 (예: "~하는 게 좋아요", "~해 주세요").
          claude_args: |
            --model claude-opus-4-8
            --allowedTools Read,mcp__github_inline_comment__create_inline_comment,Bash(git diff:*),Bash(git log:*)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  harry-rule-suggest:
    # 리뷰에서 발견한 "반복될 만한" 실수 패턴을 harry의 룰 파일에 반영하는 PR을 따로 연다.
    # - PR이 처음 열릴 때(opened)만 실행: 매 push마다 돌지 않게 해 비용/노이즈를 줄인다.
    # - 포크 PR은 제외: 프롬프트 인젝션 + 쓰기 권한이 겹치면 위험하다(리뷰 job과 동일 정책).
    # - 룰은 절대 자동 머지하지 않는다. 항상 사람이 검토 후 머지한다.
    if: >-
      ${{ github.event.action == 'opened'
      && github.event.pull_request.draft == false
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.base.ref != 'main' }}
    # 같은 PR을 re-run 하거나 직전 룰 PR이 아직 안 머지된 경우 같은 브랜치명이 겹쳐
    # push가 실패할 수 있어, PR 단위로 동시 실행을 직렬화한다.
    concurrency: harry-rule-${{ github.event.pull_request.number }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Generate harry App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.HARRY_APP_ID }}
          private-key: ${{ secrets.HARRY_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: harry rule suggestion
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          prompt: |
            너는 'harry'. 이 PR의 변경사항(diff)을 보고, harry의 리뷰 룰을
            "스스로 키우는" 작업을 한다. 대상 파일은 `.github/harry-review-rules.md`.

            대상 PR 번호와 base 브랜치는 환경변수 $PR_NUMBER, $PR_BASE 로 주어진다.
            셸 명령에서는 반드시 이 환경변수를 그대로 써라(값을 직접 타이핑하지 마라).

            절차:
            1. `.github/harry-review-rules.md`를 읽어 이미 있는 룰을 모두 파악한다.
            2. `gh pr diff "$PR_NUMBER"`로 이 PR의 diff를 가져온다(checkout 기본 ref에
               의존하지 말고 항상 이 명령으로 받아라). 이 diff 분석은 반드시 아래 5번의
               git checkout 전에 끝내라(checkout 후엔 working tree가 base로 바뀐다).
               그 diff에서 "앞으로도 반복될 만한, 일반화 가능한 실수 패턴"을 찾는다.
               - 기존 룰로 이미 잡히는 패턴이면 새 룰이 아니다. 무시한다.
               - 일회성이거나 사소한 문제는 룰로 만들지 않는다.
               - 레포 오너 취향(surgical change, React Compiler 전제, 불필요한
                 useEffect 금지, 데이터 패칭/ API 함수 위치 일관성 등)과 결이 맞아야 한다.
            3. 룰로 만들 가치가 있는 패턴이 "없으면" 아무것도 하지 말고 그냥 끝낸다.
               대부분의 PR은 여기서 끝난다. 억지로 룰을 만들지 마라.
            4. 가치 있는 패턴이 있으면 "최대 1개"만 추가한다. 기존 파일의 알맞은
               섹션에, 한국어 '해요체'로, 기존 룰과 같은 형식의 한 줄로 적는다.
            5. 룰 PR은 base 브랜치에서 깨끗하게 따서 만든다(이 PR의 코드 변경이
               섞이면 안 된다):
                 git config user.name "harry"
                 git config user.email "harry@users.noreply.github.com"
                 git fetch origin "$PR_BASE"
                 git checkout -b "harry/rule-$PR_NUMBER" "origin/$PR_BASE"
               그 위에서 `.github/harry-review-rules.md`만 셸 명령(heredoc 추가나 sed
               등)으로 수정한 뒤 커밋·푸시한다. 파일 편집 전용 도구는 없으니 Bash로 한다.
            6. `gh pr create --base "$PR_BASE"`로 PR을 연다. 제목은
               `[chore] harry 리뷰 룰 추가 제안 (#${PR_NUMBER})`,
               본문에는 "어떤 PR의 어떤 패턴에서 이 룰을 도출했는지"를 1~2줄로 적는다.
               이 룰 PR은 절대 자동 머지하지 마라. 사람이 검토 후 머지한다.
          claude_args: |
            --model claude-opus-4-8
            --allowedTools Read,Bash
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}

  harry-reply:
    # harry의 인라인 리뷰 코멘트에 사람이 답글을 달면, 그 스레드에만 답변한다.
    # - 사람(비봇) 답글만 반응: 봇 답글(harry 자신 포함)에 반응하면 무한 루프.
    # - in_reply_to_id 있는 답글만: 최초 인라인 코멘트나 새 top-level 코멘트엔 반응 안 함.
    # - 포크 PR 제외(프롬프트 인젝션) + main 대상 제외 — 리뷰 job과 동일 정책.
    # - '스레드 루트가 harry인지'는 harry가 프롬프트에서 확인 후, 아니면 아무것도 안 한다.
    if: >-
      ${{ github.event_name == 'pull_request_review_comment'
      && github.event.action == 'created'
      && github.event.comment.user.type != 'Bot'
      && contains(fromJson('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
      && github.event.comment.in_reply_to_id != null
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.base.ref != 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Generate harry App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.HARRY_APP_ID }}
          private-key: ${{ secrets.HARRY_APP_PRIVATE_KEY }}
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: harry reply
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          prompt: |
            너는 'harry'라는 PR 리뷰봇이다. 저장소 루트의 `.github/harry-review-rules.md`를
            읽어 페르소나·말투(한국어 '해요체')를 따른다.

            누군가 harry의 인라인 리뷰 코멘트(스레드)에 답글을 달았다. 이 답글에만 반응한다.
            대상 정보는 환경변수로 주어진다(값을 직접 타이핑하지 말고 항상 환경변수를 써라):
            - PR 번호: $PR_NUMBER
            - 스레드 루트 코멘트 id(답글이 달린 원본 인라인 코멘트): $ROOT_COMMENT_ID
            - 방금 달린 답글 코멘트 id: $REPLY_COMMENT_ID

            절차:
            1. `gh api "repos/$REPO/pulls/comments/$ROOT_COMMENT_ID"`로 스레드 루트 코멘트를 가져온다.
               작성자(`.user.login`)가 'reviewer-harry[bot]'가 아니면 harry가 시작한 스레드가
               아니다 → 아무것도 하지 말고 즉시 끝낸다.
            2. harry의 스레드가 맞으면 맥락을 파악한다:
               - 루트 코멘트(harry의 원래 지적)의 코드 위치(`.path`, `.line`, `.diff_hunk`)와 본문.
               - 스레드의 이후 답글들: `gh api "repos/$REPO/pulls/$PR_NUMBER/comments" --paginate`로
                 받아 `in_reply_to_id == $ROOT_COMMENT_ID` 인 것들을 시간순으로 읽는다.
                 방금 달린 $REPLY_COMMENT_ID 답글이 사람이 harry에게 한 말이다.
            3. 그 답글에 harry로서 답한다:
               - 상대 말이 맞으면 인정하고, 지적이 타당했으면 근거를 짧게 보강한다.
               - 반박·질문이면 룰(`.github/harry-review-rules.md`) 기준으로 논리적으로 답한다.
               - 확정 못 할 내용은 단정하지 말고 확인이 필요하다고 말한다.
               - 단순 확인/감사처럼 답할 내용이 없으면 아무것도 하지 마라.
            4. 답변은 반드시 **그 인라인 스레드에만** 단다:
               `gh api --method POST "repos/$REPO/pulls/$PR_NUMBER/comments/$ROOT_COMMENT_ID/replies" -f body="답변내용"`
               PR 본문에 새 top-level 코멘트나 다른 새 인라인 코멘트를 만들지 마라. 오직 이 스레드 답글 하나만.

            모든 답변은 한국어 '해요체'로 작성한다.
          claude_args: |
            --model claude-opus-4-8
            --allowedTools Read,Bash(gh api:*)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ROOT_COMMENT_ID: ${{ github.event.comment.in_reply_to_id }}
          REPLY_COMMENT_ID: ${{ github.event.comment.id }}
