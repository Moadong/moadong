name: Chromatic

on:
  push:
    branches: [main]
    paths:
      - 'frontend/src/**'
      - 'frontend/.storybook/**'
      - 'frontend/package*.json'
      - '.github/workflows/chromatic.yml'
  pull_request:
    branches: [main, develop-fe]
    paths:
      - 'frontend/src/**'
      - 'frontend/.storybook/**'
      - 'frontend/package*.json'
      - '.github/workflows/chromatic.yml'
  workflow_dispatch:

# Dependabot이 띄운 런의 GITHUB_TOKEN은 기본이 읽기 전용이라 코멘트 스텝이
# 403을 맞는다. 2021-10부터 Dependabot 런도 이 키를 존중한다.
permissions:
  contents: read
  pull-requests: write

jobs:
  chromatic:
    runs-on: ubuntu-latest
    env:
      # 토큰 값이 아니라 유무만 올린다. 값을 job env에 두면 npm ci 등
      # 같은 job의 모든 스텝이 읽을 수 있어 노출면이 넓어진다.
      HAS_CHROMATIC_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN != '' }}
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Skip notice (토큰 없음)
        if: env.HAS_CHROMATIC_TOKEN != 'true'
        run: echo "::notice::CHROMATIC_PROJECT_TOKEN이 없어 Chromatic을 건너뜁니다. Dependabot PR이라면 Settings > Secrets and variables > Dependabot 에 토큰을 등록하세요."

      - name: Run Chromatic
        id: chromatic
        if: env.HAS_CHROMATIC_TOKEN == 'true'
        uses: chromaui/action@latest
        with:
          workingDir: frontend
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          autoAcceptChanges: "main"
          # 스냅샷 한도에 걸린 빌드는 publish-only로 끝나 종료 코드와 changeCount가
          # 정상 빌드와 같다. 제한 여부(build.wasLimited)는 진단 파일에만 남는다.
          diagnosticsFile: true

      - name: Check snapshot limit
        id: snapshot
        if: steps.chromatic.outcome == 'success'
        run: |
          # 진단 파일을 못 읽으면 검사가 됐는지 알 수 없으므로 제한된 것으로 본다.
          limited=$(jq -r 'if .build then (.build.wasLimited // false) else "unknown" end' chromatic-diagnostics.json 2>/dev/null || echo unknown)
          echo "limited=$limited" >> "$GITHUB_OUTPUT"
          if [ "$limited" != "false" ]; then
            echo "::warning::Chromatic 스냅샷을 찍지 않은 빌드입니다(wasLimited=$limited). 스냅샷 한도를 확인하세요."
          fi

      - name: Comment PR (변경 있음)
        if: github.event_name == 'pull_request' && steps.snapshot.outputs.limited == 'false' && steps.chromatic.outputs.changeCount > 0
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: chromatic
          message: |
            ## 🎨 UI 변경사항을 확인해주세요

            > 변경된 스토리를 Chromatic에서 확인해주세요.

            | 구분 | 링크 |
            |---|---|
            | 🔍 변경사항 리뷰 | ${{ steps.chromatic.outputs.buildUrl }} |
            | 📖 Storybook | ${{ steps.chromatic.outputs.storybookUrl }} |

            **${{ steps.chromatic.outputs.changeCount }}개** 스토리 변경 · 전체 **${{ steps.chromatic.outputs.specCount }}개** 스토리 · **${{ steps.chromatic.outputs.componentCount }}개** 컴포넌트

      - name: Comment PR (변경 없음)
        if: github.event_name == 'pull_request' && steps.snapshot.outputs.limited == 'false' && steps.chromatic.outputs.changeCount == 0
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: chromatic
          message: |
            ## ✅ UI 변경사항 없음

            | 구분 | 링크 |
            |---|---|
            | 📖 Storybook | ${{ steps.chromatic.outputs.storybookUrl }} |

            전체 **${{ steps.chromatic.outputs.specCount }}개** 스토리 · **${{ steps.chromatic.outputs.componentCount }}개** 컴포넌트

      - name: Comment PR (검사 안 됨)
        if: github.event_name == 'pull_request' && steps.chromatic.outcome == 'success' && steps.snapshot.outputs.limited != 'false'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: chromatic
          message: |
            ## ⚠️ UI 변경사항을 검사하지 못했어요

            > Chromatic 스냅샷 한도에 걸려 이 빌드는 스냅샷을 찍지 않았어요. **변경이 없다는 뜻이 아니에요.** 한도가 풀린 뒤 다시 실행하거나 로컬에서 Storybook으로 확인해 주세요.

            | 구분 | 링크 |
            |---|---|
            | 📖 Storybook | ${{ steps.chromatic.outputs.storybookUrl }} |

            전체 **${{ steps.chromatic.outputs.specCount }}개** 스토리 · **${{ steps.chromatic.outputs.componentCount }}개** 컴포넌트
