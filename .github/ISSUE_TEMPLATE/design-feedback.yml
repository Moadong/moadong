name: '디자인 피드백'
description: '실서비스에서 ?design=1 툴바로 복사한 메모를 붙여넣으면 에이전트가 PR을 만듭니다.'
labels: [design-feedback]
title: '[design] '
body:
  - type: markdown
    attributes:
      value: |
        1. `https://moadong.com/?design=1`로 접속하면 오른쪽 아래 툴바가 뜹니다.
        2. 요소를 클릭해 메모를 남기고 "복사"를 누르세요. 여러 개 가능합니다.
           한 이슈에는 같은 화면·비슷한 수정끼리 묶어 주세요. 성격이 다른 수정은 이슈를 나눠 올리면 PR도 나뉘어 보기 쉽습니다.
        3. 복사하면 이 폼이 내용이 채워진 채로 열립니다. 그대로 제출하시면 됩니다.
           (메모가 아주 많으면 앞부분만 채워집니다. 클립보드에 전체 내용이 있으면 지우고 붙여넣으세요.)
        4. 에이전트가 PR을 열고 이 이슈에 링크를 답니다.
        5. PR의 Vercel 프리뷰에서 확인하세요. 더 고칠 게 있으면 프리뷰에서 툴바로 메모를 남기고 "복사"한 내용을
           **PR의 Conversation 탭 맨 아래 댓글창**에 그대로 붙여넣으세요(코드 줄 댓글·리뷰는 안 됩니다). 에이전트가 그 PR 위에 이어서 고칩니다. (복사하면 새 이슈 폼이 열리는데, 제출하지 말고 닫으세요.)
           처음부터 다시 만들고 싶으면 이 이슈의 `design-feedback` 라벨을 뗐다 다시 붙이세요. PR 댓글로 더한 수정도 사라집니다.

  - type: textarea
    id: feedback
    attributes:
      label: '🎨 피드백'
      description: '툴바에서 복사한 내용을 그대로 붙여넣으세요.'
    validations:
      required: true

  - type: input
    id: storyKey
    attributes:
      label: '🎟️ 상위 스토리 (선택)'
      description: '연결할 Jira 스토리 키가 있으면 적으세요 (예: MOA-42).'
      placeholder: 'MOA-42'
    validations:
      required: false
